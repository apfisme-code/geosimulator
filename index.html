<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тороидальный мир — Sed по руслам + лава</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d15; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; color: #cfe;
    font: 13px/1.55 ui-monospace, monospace;
    background: rgba(0,0,0,.5); padding: 10px 14px; border-radius: 6px;
    pointer-events: none; white-space: pre; z-index: 5; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px;
    background: #fff; border-radius: 50%; opacity: .85; pointer-events: none; z-index: 5; }
  #sliceCanvas { position: fixed; left: 12px; bottom: 12px; width: 640px; height: 140px;
    background: rgba(0,0,0,.72); border-radius: 6px; pointer-events: none;
    display: none; z-index: 10; }
  #graphCanvas { position: fixed; right: 12px; bottom: 12px; width: 360px; height: 200px;
    background: rgba(0,0,0,.72); border-radius: 6px; pointer-events: none;
    display: none; z-index: 10; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: rgba(0,0,0,.72); color: #dfe; font: 20px/1.4 system-ui, sans-serif;
    text-align: center; user-select: none; z-index: 20; }
  #start small { display: block; margin-top: 12px; font-size: 14px; opacity: .78; line-height: 1.8 }
  #start kbd { background: #222; border: 1px solid #555; border-radius: 3px;
    padding: 1px 5px; font: 12px ui-monospace, monospace; }
  #err { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 40vh;
    overflow: auto; padding: 10px 14px; background: rgba(120,30,30,.92); color: #fee;
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; border-radius: 6px;
    display: none; z-index: 100; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="cross"></div>
<canvas id="sliceCanvas" width="640" height="140"></canvas>
<canvas id="graphCanvas" width="360" height="200"></canvas>
<pre id="err"></pre>
<div id="start">Нажмите, чтобы играть
  <small>
    <kbd>WASD</kbd> движ · <kbd>Мышь</kbd> обзор · <kbd>Shift</kbd> бег · <kbd>Space</kbd> прыжок · <kbd>Esc</kbd> выход<br>
    <kbd>P</kbd> пауза · <kbd>T</kbd> дождь · <kbd>B</kbd> ветер · <kbd>I</kbd> лёд · <kbd>V</kbd> вулканы<br>
    <kbd>L</kbd> overlay · <kbd>X</kbd> разрез · <kbd>Y</kbd> графики · <kbd>R</kbd> рестарт · <kbd>G</kbd> новый мир
  </small>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module" src="./js/main.js"></script>
</body>
</html>
